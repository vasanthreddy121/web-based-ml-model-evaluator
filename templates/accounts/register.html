{% extends "base.html" %}

{% block title %}Create Account - ML Model Evaluator{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div class="card">
        <h1 class="card-title" style="text-align: center; margin-bottom: 0.5rem;">Create Account</h1>
        <p class="card-desc" style="text-align: center; margin-bottom: 1.5rem;">Register to manage datasets, configure pipelines, and track models</p>

        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;" for="username">Username <span style="color: var(--danger);">*</span></label>
                <input type="text" name="username" id="username" class="form-control" style="width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 0.95rem;" required autofocus>
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;" for="email">Email Address (Optional)</label>
                <input type="email" name="email" id="email" class="form-control" style="width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 0.95rem;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;" for="password">Password (min 6 chars) <span style="color: var(--danger);">*</span></label>
                <input type="password" name="password" id="password" class="form-control" style="width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 0.95rem;" required minlength="6">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;" for="password_confirm">Confirm Password <span style="color: var(--danger);">*</span></label>
                <input type="password" name="password_confirm" id="password_confirm" class="form-control" style="width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 0.95rem;" required minlength="6">
            </div>

            <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; font-size: 1rem;">Create Account</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray-700);">
            Already have an account? <a href="{% url 'login-web' %}" style="color: var(--primary); font-weight: 600;">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
